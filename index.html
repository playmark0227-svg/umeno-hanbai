<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>梅乃寿司 販売管理</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12293d">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='6' fill='%2312293d'/><ellipse cx='32' cy='38' rx='19' ry='11' fill='%23f6f1e7'/><path d='M13 34c6-9 32-9 38 0l-1 4c-5-8-31-8-36 0z' fill='%23b5342a'/></svg>">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- 起動中 -->
<div id="boot" class="boot">
  <div class="boot__mark" aria-hidden="true"></div>
  <p class="boot__name">梅乃寿司</p>
  <p class="boot__sub">販売管理</p>
  <p class="boot__msg" id="bootMsg">読み込んでいます…</p>
</div>

<!-- 画面全体 -->
<div id="shell" class="shell" hidden>
  <header class="head">
    <button class="head__home" id="btnHome" type="button" title="メインメニューへ">
      <span class="head__logo">梅乃寿司</span>
      <span class="head__logosub">販売管理</span>
    </button>
    <nav class="crumbs" id="crumbs" aria-label="今いる画面"></nav>
    <div class="head__right">
      <div class="fontsize" role="group" aria-label="文字の大きさ">
        <button type="button" data-size="1" title="標準の文字">小</button>
        <button type="button" data-size="2" title="大きい文字">中</button>
        <button type="button" data-size="3" title="特に大きい文字">大</button>
      </div>
      <span class="head__conn" id="conn" title="保存先"></span>
      <span class="head__date" id="today"></span>
      <button class="head__user" id="btnUser" type="button"></button>
    </div>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <footer class="foot">
    <span id="footHint" class="foot__hint"></span>
    <span class="foot__ver">梅乃寿司 販売管理 v1.0</span>
  </footer>
</div>

<div id="toaster" class="toaster" aria-live="polite"></div>
<div id="modalHost"></div>

<script type="module" src="js/app.js"></script>
<noscript><p style="padding:2rem;font:16px sans-serif">このソフトを使うにはJavaScriptを有効にしてください。</p></noscript>
</body>
</html>
